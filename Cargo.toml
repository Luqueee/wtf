[workspace]
members = [
    "crates/wtf-core",
    "crates/wtf-cli",
    "crates/wtf-train",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["WTF Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tempfile = "3.17"
nix = { version = "0.29", features = ["signal", "process"] }
